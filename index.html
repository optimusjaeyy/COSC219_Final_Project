<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manga Shelf</title>
    <!--Links main.js-->
    <script type="module" src="js/main.js"></script>
    <!--Links styles.css-->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main>
      <section id="container">
        <h1 id="main-header">Manga Shelf</h1>
        <form id="search-form">
          <label for="search-input">Search for Manga, Manhwa, Manhua</label
          ><br />
          <input
            type="search"
            id="search-input"
            name="search"
            list="suggestions"
            placeholder="Search for manga"
          />
          <datalist id="suggestions"></datalist>
          <button type="submit">Search</button>
        </form>
      </section>

      <div id="container">
        <p id="status" role="status"></p>
        <ul id="results" class="cards"></ul>
      </div>
    </main>
  </body>
</html>
